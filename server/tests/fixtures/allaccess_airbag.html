null,"landingPageUrl":"https://web-layout.s3.amazonaws.com/event/production/6b830376-15b2-4bbd-8852-81dc04535f72","configurationUrl":"https://web-layout.s3.amazonaws.com/event/production/6b830376-15b2-4bbd-8852-81dc04535f72","hasPromotionsAvailable":false,"embeddedApp":null,"pageTitle":null,"keywords":null,"customRemarketingPixel":"null","customConversionPixel":"null","accessLink":"airbag","notStarted":false,"hasShows":true,"onSale":true,"pickerAutoOpen":false,"widgetComponents":[{"id":"component-7d83604c-f285-4001-adfe-03ad3fba43fa","widgetType":"MixRichContent","state":{"enabled":true,"header":{"title":""},"config":{"containerAppearance":"centered","customClass":"","backgroundColor":"#161413","titleColor":"","paragraphColor":"","linkColor":""},"verticalAlign":"center","left":{"type":"html","html":"\u003cdiv style=\"\r\n  max-width: 100%;\r\n  margin: 40px auto;\r\n  color: #ffffff;\r\n  font-family: 'Arial Black', Arial, Helvetica, sans-serif;\r\n  text-align: center;\r\n  letter-spacing: 0.5px;\r\n\"\u003e\r\n\r\n  \u003c!-- LOGO AIRBAG --\u003e\r\n  \u003cdiv style=\"margin-bottom: 20px;\"\u003e\r\n    \u003cimg\r\n      src=\"https://cdn.getcrowder.com/images/ce2ab09b-01aa-417c-b0b5-1513e46733c3-airbaglogoblancotransparente.png\"\r\n      alt=\"Airbag\"\r\n      style=\"\r\n        display: block;\r\n        width: 100%;\r\n        max-width: 300px;\r\n        height: auto;\r\n        margin: 0 auto;\r\n      \"\r\n    \u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- TÍTULO PRINCIPAL --\u003e\r\n  \u003ch2 style=\"\r\n    font-size: 20px;\r\n    margin-bottom: 10px;\r\n    text-transform: uppercase;\r\n    font-weight: 900;\r\n    line-height: 1.2;\r\n  \"\u003e\r\n    CIERRA EL AÑO EN BUENOS AIRES CON SU SEXTO RIVER\r\n  \u003c/h2\u003e\r\n\r\n  \u003c!-- DESCRIPCIÓN --\u003e\r\n\r\n  \u003cp style=\"\r\n    font-size: 12px;\r\n    line-height: 1.6;\r\n    max-width: 750px;\r\n    margin: 0 auto 30px auto;\r\n    color: #dddddd;\r\n    text-transform: uppercase;\r\n  \"\u003e\r\n    LOS HERMANOS SARDELLI VUELVEN AL MONUMENTAL, SUMAN DIEZ ESTADIOS EN UN AÑO Y MEDIO Y ADELANTAN “OCARINA”, UN NUEVO FRAGMENTO DE EL CLUB DE LA PELEA II.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- FECHA --\u003e\r\n  \u003cdiv style=\"\r\n    font-size: 16px;\r\n    font-weight: 900;\r\n    margin-bottom: 30px;\r\n    text-transform: uppercase;\r\n    border-top: 1px solid #444;\r\n    border-bottom: 1px solid #444;\r\n    padding: 15px 0;\r\n  \"\u003e\r\n    \u003cspan style=\"color:#B01D2C;\"\u003e\r\n      11 DE DICIEMBRE\r\n    \u003c/span\u003e\r\n    \u003cbr\u003e\r\n    ESTADIO RIVER PLATE\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- PREVENTA Y VENTA GENERAL --\u003e\r\n  \u003cdiv style=\"\r\n    max-width: 750px;\r\n    margin: 35px auto 0 auto;\r\n    text-align: center;\r\n    font-family: 'Arial Black', Arial, Helvetica, sans-serif;\r\n    text-transform: uppercase;\r\n    line-height: 1.4;\r\n  \"\u003e\r\n\r\n    \u003c!-- PREVENTA --\u003e\r\n    \u003cp style=\"\r\n      margin: 0 0 5px 0;\r\n      font-size: 12px;\r\n      font-weight: 900;\r\n      color: #B01D2C;\r\n    \"\u003e\r\n      PREVENTA EXCLUSIVA VISA BBVA\r\n    \u003c/p\u003e\r\n\r\n    \u003cp style=\"\r\n      margin: 0 0 25px 0;\r\n      font-size: 10px;\r\n      font-weight: 600;\r\n      color: #ffffff;\r\n    \"\u003e\r\n      LUNES 2 DE NOVIEMBRE A LAS 14HS\r\n      Disfrutá de 6 cuotas sin interés con tarjetas VISA BBVA.\r\n    \u003c/p\u003e\r\n\r\n    \u003c!-- VENTA GENERAL --\u003e\r\n    \u003cp style=\"\r\n      margin: 0 0 5px 0;\r\n      font-size: 12px;\r\n      font-weight: 900;\r\n      color: #B01D2C;\r\n    \"\u003e\r\n      VENTA GENERAL\r\n    \u003c/p\u003e\r\n\r\n    \u003cp style=\"\r\n      margin: 0;\r\n      font-size: 10px;\r\n      font-weight: 600;\r\n      color: #ffffff;\r\n    \"\u003e\r\n      MARTES 3 DE NOVIEMBRE A LAS 14HS\r\n      Con todos los medios de pago y disfrutá de 6 cuotas sin interés con tarjetas VISA BBVA\r\n    \u003c/p\u003e\r\n\r\n  \u003c/div\u003e\r\n\r\n\u003c/div\u003e"},"right":{"type":"image","imageUrl":"https://cdn.getcrowder.com/images/ae4a775b-8a41-45d0-96ce-8cdcc17e32c6-abgriver1x1quentro-1.jpg"}},"version":2},{"id":"component-34851be2-d65c-4058-b673-d6644f4a0b54","widgetType":"Html","state":{"enabled":true,"header":{"title":""},"config":{"containerAppearance":"centered","customClass":"","backgroundColor":"#161413","titleColor":"","paragraphColor":"","linkColor":""},"html":"\r\n\u003cdiv style=\"\r\n  width: 100%;\r\n  max-width: 850px;\r\n  margin: 40px auto;\r\n  padding: 0 18px;\r\n  box-sizing: border-box;\r\n  color: #ffffff;\r\n  font-family: Arial, Helvetica, sans-serif;\r\n  text-align: center;\r\n  letter-spacing: 0.3px;\r\n\"\u003e\r\n\r\n  \u003cp style=\"font-size:clamp(14px,1.5vw,15px);line-height:1.9;color:#dddddd;margin:0 auto 24px;\"\u003e\r\n    Hay momentos que marcan una carrera. Para Airbag, el\r\n    \u003cstrong style=\"color:#ffffff;\"\u003eEstadio River Plate\u003c/strong\u003e\r\n    se convirtió en uno de los grandes escenarios de su trayectoria. Tras reprogramar el show previsto para octubre, y en el marco de su gira internacional, los hermanos Sardelli confirmaron su regreso al Monumental:\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003eel viernes 11 de diciembre volverán a cerrar un año inolvidable en el estadio más grande del país.\u003c/strong\u003e\r\n    Será el sexto River Plate de “El Club de la Pelea”, una etapa de crecimiento sostenido y conexión cada vez más fuerte con su público, que ya empieza a mirar hacia adelante con\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003e“Ocarina”\u003c/strong\u003e,\r\n    el nuevo fragmento de El Club de la Pelea II.\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"font-size:clamp(14px,1.5vw,15px);line-height:1.9;color:#dddddd;margin:0 auto 24px;\"\u003e\r\n    Desde aquel primer doblete en River en mayo del año pasado, el Monumental se convirtió en escenario de algunos de los shows más importantes de la banda. A los\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003ecinco River Plate agotados\u003c/strong\u003e\r\n    se sumaron\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003ecuatro Vélez también agotados en mayo de 2026.\u003c/strong\u003e\r\n    Con la nueva fecha del 11 de diciembre, Airbag alcanza así\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003ediez estadios en Buenos Aires en apenas un año y medio.\u003c/strong\u003e\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"font-size:clamp(14px,1.5vw,15px);line-height:1.9;color:#dddddd;margin:0 auto 24px;\"\u003e\r\n    El presente de Airbag también trasciende las fronteras. Durante este año, la gira \"El Club de la Pelea 2026\" recorrió\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003esiete países y más de veinte shows,\u003c/strong\u003e\r\n    con localidades agotadas en distintas ciudades de Argentina, Chile, Paraguay, España, Uruguay y Perú. La ruta comenzó en abril con estadios agotados en La Rioja, San Juan, San Luis, Catamarca y Santiago del Estero y continuó con los cuatro Vélez, pasando por Europa, con presentaciones en Barcelona y Madrid, continuó por Chile con un doble Teatro Caupolicán, antes de regresar a Argentina para un Estadio Central Córdoba de Rosario y el mítico Estadio de Belgrano en Córdoba, ambos agotados reuniendo\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003emás de 60.000 personas.\u003c/strong\u003e\r\n    El recorrido todavía tiene por delante nuevas paradas en Paraguay, Perú y Bolivia.\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"font-size:clamp(14px,1.5vw,15px);line-height:1.9;color:#dddddd;margin:0 auto 24px;\"\u003e\r\n    Mientras la banda atraviesa uno de sus períodos de mayor expansión, también comienza a tomar forma una nueva etapa musical.\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003e\"Blues del Infierno\", \"Asuntos Pendientes\" y \"Reptiles\"\u003c/strong\u003e\r\n    son los tres singles que anticipan El Club de la Pelea II y que ya forman parte del repertorio de la gira. Recientemente, la banda adelantó un fragmento de su nuevo single\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003e\"Epifanía\".\u003c/strong\u003e\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"font-size:clamp(14px,1.5vw,15px);line-height:1.9;color:#dddddd;margin:0 auto 24px;\"\u003e\r\n    Las nuevas canciones llegan después del impacto de El Club de la Pelea I, el octavo álbum de estudio de Airbag, que superó los\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003e300 millones de reproducciones\u003c/strong\u003e\r\n    y llevó\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003eseis canciones al Top 50 en menos de 24 horas,\u003c/strong\u003e\r\n    consolidándose como uno de los grandes fenómenos recientes del rock argentino.\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"font-size:clamp(14px,1.5vw,15px);line-height:1.9;color:#dddddd;margin:0 auto 30px;\"\u003e\r\n    Para su nuevo show en el Monumental, Airbag prepara una puesta en escena a la altura de la escala que alcanzó la banda:\r\n    \u003cstrong style=\"color:#B01D2C;\"\u003efuego, potencia y una impactante escenografía\u003c/strong\u003e\r\n    acompañarán una noche construida alrededor de los grandes himnos de su carrera y las canciones que anticipan su próximo capítulo.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- CIERRE DESTACADO --\u003e\r\n  \u003cdiv style=\"\r\n    border-top:1px solid #444;\r\n    padding:25px 10px 0;\r\n    margin-top:10px;\r\n  \"\u003e\r\n    \u003cp style=\"\r\n      font-size:clamp(19px,2.2vw,23px);\r\n      line-height:1.4;\r\n      font-weight:900;\r\n      color:#B01D2C;\r\n      margin:0 auto 15px;\r\n    \"\u003e\r\n      El 11 de diciembre, Airbag vuelve al Monumental.\r\n    \u003c/p\u003e\r\n\r\n    \u003cp style=\"font-size:clamp(14px,1.5vw,15px);line-height:1.9;color:#dddddd;margin:0 auto;\"\u003e\r\n      Después de nueve estadios en Buenos Aires, siete países recorridos y una gira que continúa expandiéndose, los hermanos Sardelli regresan a casa para cerrar el año a la altura de una etapa extraordinaria para la banda.\r\n    \u003c/p\u003e\r\n  \u003c/div\u003e\r\n\r\n\u003c/div\u003e\r\n"},"version":1},{"id":"component-f857b1a1-0c1f-4049-b177-49cea41ec9ad","widgetType":"Html","state":{"enabled":true,"header":{"title":""},"config":{"containerAppearance":"centered","customClass":"","backgroundColor":"#161413","titleColor":"","paragraphColor":"","linkColor":""},"html":"\u003cdiv style=\"\r\n  max-width: 900px;\r\n  margin: 40px auto;\r\n  color: #ffffff;\r\n  font-family: Arial, Helvetica, sans-serif;\r\n  text-align: center;\r\n\"\u003e\r\n\r\n  \u003c!-- TÍTULO --\u003e\r\n  \u003cp style=\"\r\n    font-size: 18px;\r\n    font-weight: 900;\r\n    margin-bottom: 25px;\r\n    text-transform: uppercase;\r\n    letter-spacing: 1px;\r\n  \"\u003e\r\n    \u003cspan style=\"color:#B01D2C;\"\u003eEl Club de la Pelea Tour 2026\u003c/span\u003e\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- LISTA --\u003e\r\n  \u003cdiv style=\"\r\n    font-size: 14px;\r\n    line-height: 1.8;\r\n    color: #dddddd;\r\n    border-top: 1px solid #444;\r\n    border-bottom: 1px solid #444;\r\n    padding: 20px 0;\r\n  \"\u003e\r\n\r\n    17 DE ABR | Superdomo | La Rioja, Argentina\r\n    \u003cspan style=\"color:#B01D2C; font-weight:800;\"\u003e AGOTADO\u003c/span\u003e\u003cbr\u003e\r\n\r\n    18 DE ABR | Estadio Aldo Cantoni | San Juan, Argentina\r\n    \u003cspan style=\"color:#B01D2C; font-weight:800;\"\u003e AGOTADO\u003c/span\u003e\u003cbr\u003e\r\n\r\n    24 DE ABR | Estadio Avenida | San Luis, Argentina\r\n    \u003cspan style=\"color:#B01D2C; font-weight:800;\"\u003e AGOTADO\u003c/span\u003e\u003cbr\u003e\r\n\r\n    25 DE ABR | Polideportivo Fray Mamerto Esquiú | Catamarca, Argentina\r\n    \u003cspan style=\"color:#B01D2C; font-weight:800;\"\u003e AGOTADO\u003c/span\u003e\u003cbr\u003e\r\n\r\n    09 DE MAY | Club Olímpico | Santiago del Estero, Argentina\r\n    \u003cspan style=\"color:#B01D2C; font-weight:800;\"\u003e AGOTADO\u003c/span\u003e\u00
