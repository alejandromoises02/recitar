      "description": "*SI COMPRÁS DESDE EL EXTERIOR, SOLO SE ACEPTARÁN TARJETAS INTERNACIONALES DE CRÉDITO EN UN SOLO PAGO.    ED SHEERAN EN HURACÁNISAAC SLADE Y AMBIK, LOS TELONEROS CONFIRMADOS PARA UNA NOCHE INOLVIDABLE!!DOMINGO 29 DE NOVIEMBREESTADIO HURACÁN¡ÚLTIMAS ENTRADAS A LA VENTA!Entradas a la venta únicamente a través de Livepass.com.ar  Buenos Aires, 3 de noviembre. ¡La cuenta regresiva ya empezó! A muy pocos días de su esperado regreso al país, Ed Sheeran entra en la recta final para su show en Buenos Aires, y anuncia a los artistas que se sumarán a su noche en el Estadio Huracán el próximo 29 de noviembre, en el marco del LOOP Tour.El cantante británico estará acompañado por dos invitados especiales que serán los encargados de abrir la noche: Ambik como telonera nacional e Isaac Slade como invitado internacional.UNA NOCHE HISTÓRICA QUE YA LLEGAEl “LOOP Tour” promete a los fans una experiencia en vivo renovada, con un diseño de escenario y repertorio completamente nuevos, que incluyen canciones de su álbum recién lanzado “Play”, junto a los temas favoritos de sus fans.“Play” (editado en 2025 por el sello Warner) explora territorios musicales inéditos mediante colaboraciones con productores y músicos de todo el mundo. Inspirándose en parte en tradiciones musicales de India y Persia —y sus sorprendentes conexiones con los sonidos folk irlandeses con los que creció— Sheeran combina escalas, ritmos y melodías compartidas en un lenguaje musical sin fronteras que le da al álbum un distintivo aire global.Al mismo tiempo, Sheeran se mantiene fiel a la balada atemporal que lo convirtió en uno de los cantautores más queridos del mundo. El resultado es una colección que equilibra lo familiar y lo nuevo, ofreciendo un sonido audaz, fresco y orientado al pop.Tras su lanzamiento, “Play” arrasó y se posicionó en los puestos número 1 en todo el mundo, incluidos Australia, Austria, Bélgica, Irlanda, Alemania, Nueva Zelanda, Suiza y el Reino Unido. Sheeran lanzó “Play – The Remixes EP”, un proyecto de cuatro temas que cuenta con colaboraciones con reconocidos artistas del sur de Asia, como Hanumankind, Dhee, Santhosh Narayanan, Karan Aujla, Jonita y Arijit Singh.ACERCA DE ISAAC SLADEIsaac Slade es un cantante, compositor y pianista estadounidense, mejor conocido como cofundador y vocalista principal de The Fray. En 2022, Isaac dejó la banda y ahora regresa a los escenarios después de cuatro años con su primera gira solista en 2026.El álbum debut de The Fray, \"How to Save a Life\" (2005), fue cuádruple platino en EE. UU. y platino en Australia, Canadá, Nueva Zelanda y Reino Unido. La canción que le da título al disco llegó al puesto N°3 y permaneció en el chart durante 58 semanas consecutivas, igualando a \"Smooth\" de Santana como la séptima permanencia más larga en la historia del Hot 100. También lideró el Adult Top 40 durante 15 semanas seguidas y alcanzó el N°1 en Irlanda, España y Canadá. Además, se convirtió en el tema no oficial de Grey's Anatomy.Después de dos décadas al frente de la banda, Slade anunció que se retiraba. Explicó que ya cinco o seis años antes les había anticipado a sus compañeros que estaba comenzando una salida progresiva. Luego se mudó a la isla de Vashon, en Washington, para llevar una vida más simple como papá. Actualmente copreside una iniciativa de educación musical, Take Note Colorado, que busca que todos los estudiantes de K-12 de su estado natal, Colorado, tengan acceso a clases de música e instrumentos.En 2026 regresó a los escenarios con \"Songs I Know\", su primera gira en solitario. Sus shows combinan canciones de su catálogo, material nuevo y las canciones que lo inspiraron de joven.SOBRE AMBIKAMBIK es cantante, compositora argentina y hermana de Tiago PZK. Es una de las voces emergentes del nuevo pop local, con un estilo que cruza el indie, el pop y el folk. Con una identidad fresca y personal, es una de las grandes apuestas de la escena nacional. Actualmente se encuentra presentando su nuevo álbum \"Nadie dice te amo\", una obra de diez canciones que transforma el deseo, el enamoramiento y la intensidad emocional en un universo musical y visual propio. LOOP TOUR - SOUTH AMERICA:21/11 | Estadio Bicentenario | Santiago | Chile22/11 | Estadio Bicentenario | Santiago | Chile26/11 | Jockey Club| Asunción | Paraguay29/11 | Estadio Huracán | Buenos Aires | Argentina5/12 | NUBANK Parque | São Paulo | Brazil6/12 | NUBANK Parque | São Paulo | Brazil  Para más info de Ed Sheeran: www.edsheeran.com   SEGUÍ A MOVE CONCERTS Website |      Instagram |      X |      Facebook |       YouTube     \nProhibido el ingreso a menores de 4 años. Mayores de 4 años abonan ticket. Menores de 14 años deben ingresar acompañados por un adulto mayor de 18 años.",
