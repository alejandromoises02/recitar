sform:uppercase;\r\n    letter-spacing:-0.5px;\r\n    color:#fa4f34;\r\n  \"\u003e\r\n    KAROL G llega al Estadio River por primera vez\r\n  \u003c/h2\u003e\r\n\r\n  \u003c!-- SUB / DESTACADO --\u003e\r\n  \u003cp style=\"\r\n    margin:0 0 20px 0;\r\n    font-size:16px;\r\n    line-height:1.5;\r\n    font-weight:500;\r\n  \"\u003e\r\n    La artista global desembarca en Buenos Aires el \r\n    \u003cspan style=\"font-weight:900; color:#fa4f34;\"\u003e5 de febrero\u003c/span\u003e con \r\n    \u003cspan style=\"font-weight:900; color:#fa4f34; \"\u003e“Viajando por el mundo - Tropitour”\u003c/span\u003e, \r\n    su nueva gira mundial.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- BLOQUE INFO CLAVE --\u003e\r\n  \u003cdiv style=\"\r\n    margin:25px 0;\r\n    padding:0 10px;\r\n  \"\u003e\r\n        \u003cp style=\"margin:0 0 8px 0; font-weight:800; font-size:15px; color:#fa4f34;\"\u003e\r\n      VENTA GENERAL\r\n    \u003c/p\u003e\r\n    \u003cp style=\"margin:0; font-size:14px;\"\u003e\r\n      Jueves 21 a las 12 hs con todos los medios de pago. \u003cbr\u003e\r\n      Hasta 3 cuotas sin interés con Mastercard BNA.\r\n    \u003c/p\u003e\r\n  \u003c/div\u003e\r\n\r\n  \u003c!-- DESCRIPCION --\u003e\r\n  \u003cp style=\"\r\n    margin:20px 0 15px 0;\r\n    font-size:14px;\r\n    line-height:1.6;\r\n  \"\u003e\r\n    Un show de estadio que celebra la fuerza, el orgullo y el impacto de la música latina.\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"\r\n    margin:0 0 15px 0;\r\n    font-size:14px;\r\n    line-height:1.6;\r\n  \"\u003e\r\n    Luego de dos fines de semana históricos en Coachella, \u003cspan style=\"font-weight:800;\"\u003eKAROL G\u003c/span\u003e hizo historia al convertirse en la primera artista latina en encabezar el festival, con un espectáculo que trascendió el escenario y se convirtió en un momento cultural de impacto global.\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"\r\n    margin:0 0 15px 0;\r\n    font-size:14px;\r\n    line-height:1.6;\r\n  \"\u003e\r\n    Aclamada como una poderosa celebración de la cultura y la identidad latina, su presentación marcó un antes y un después, no solo en su carrera, sino también en el alcance de la música latina a nivel mundial.\r\n  \u003c/p\u003e\r\n\r\n  \u003cp style=\"\r\n    margin:0;\r\n    font-size:14px;\r\n    line-height:1.6;\r\n  \"\u003e\r\n    En ese contexto, la artista anuncia su nueva gira mundial \r\n    \u003cspan style=\"font-weight:800;\"\u003e“Viajando Por El Mundo Tropitour”\u003c/span\u003e, \r\n    su tour más ambicioso hasta la fecha, que pasó de 39 a \r\n    \u003cspan style=\"font-weight:900; color:#fa4f34;\"\u003e63 shows confirmados en estadios\u003c/span\u003e, \r\n    con nuevas fechas en Los Ángeles, Chicago, Nueva York, Miami, San Francisco, Barcelona, Sevilla, Madrid, Bogotá, Ciudad de México, Lima, Quito y Santiago de Chile. \r\n    En varios mercados, las noches adicionales se agotaron en tiempo récord.\r\n  \u003c/p\u003e\r\n\r\n\u003c/div\u003e"},"right":{"type":"image","imageUrl":"https://cdn.getcrowder.com/images/54c63f01-85b9-4b8f-9a70-a632d77370b4-b7c84506-9bfb-46d3-8d8e-67588f6a5824-fda1dd58-d93b-42ce-b427-5334caf33dce-kgticketera640x640.jpg"}},"version":2},{"id":"component-85ec7cdf-a1d0-4f9c-9fd7-f5fe2096e62e","widgetType":"Html","state":{"enabled":true,"header":{"title":""},"config":{"containerAppearance":"centered"},"html":"\u003cdiv style=\"margin:50px auto; max-width:800px; width:100%; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; color:#111; text-align:center;\"\u003e\r\n\r\n  \u003c!-- INTRO --\u003e\r\n  \u003cp style=\"margin:0 0 20px 0; font-size:15px; line-height:1.7;\"\u003e\r\n    Como parte de este nuevo capítulo, \r\n    \u003cspan style=\"font-weight:900; color:#fa4f34;\"\u003eKAROL G se presentará por primera vez en el Estadio River Plate\u003c/span\u003e, \r\n    consolidando su vínculo con el público argentino y llevando a Buenos Aires una experiencia de escala internacional.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- BLOQUE 1 --\u003e\r\n  \u003cp style=\"margin:0 0 20px 0; font-size:15px; line-height:1.7;\"\u003e\r\n    Después del enorme éxito de \u003cspan style=\"font-weight:800;\"\u003eMañana Será Bonito Tour\u003c/span\u003e, que superó los \r\n    \u003cspan style=\"font-weight:900;\"\u003e2.3 millones de entradas vendidas\u003c/span\u003e en 62 fechas y recaudó más de \r\n    \u003cspan style=\"font-weight:900;\"\u003e300 millones de dólares\u003c/span\u003e, KAROL G vuelve a salir al mundo con una propuesta que reafirma su lugar como una de las artistas más importantes de la música global. \r\n    Aquella gira tuvo un cierre memorable con cuatro noches consecutivas agotadas en el \r\n    \u003cspan style=\"font-weight:800;\"\u003eEstadio Santiago Bernabéu de Madrid\u003c/span\u003e, confirmando la magnitud de su fenómeno a nivel internacional.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- BLOQUE 2 --\u003e\r\n  \u003cp style=\"margin:0 0 20px 0; font-size:15px; line-height:1.7;\"\u003e\r\n    Con \u003cspan style=\"font-weight:900;\"\u003e“Viajando Por El Mundo Tropitour”\u003c/span\u003e, la artista lleva su universo creativo a una nueva dimensión. \r\n    La gira acompaña el espíritu de \u003cspan style=\"font-weight:800;\"\u003eTROPICOQUETA\u003c/span\u003e, su álbum de 2025, que debutó en el \r\n    \u003cspan style=\"font-weight:900;\"\u003eNo. 1 del chart Top Latin Albums de Billboard\u003c/span\u003e, convirtiéndose en su cuarto álbum consecutivo en alcanzar esa posición. \r\n    El disco, además, registró la mayor semana de reproducciones en Estados Unidos para un álbum latino de una artista femenina.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- BLOQUE 3 --\u003e\r\n  \u003cp style=\"margin:0 0 20px 0; font-size:15px; line-height:1.7;\"\u003e\r\n    El proyecto celebra la identidad latina desde una mirada colorida, festiva y emocional, recorriendo géneros como el merengue, la bachata, la cumbia, la salsa y el reggaetón. \r\n    En vivo, esa energía se transforma en una experiencia de estadio que combina música, puesta visual, emoción y una conexión directa con sus fans.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- BLOQUE 4 --\u003e\r\n  \u003cp style=\"margin:0 0 20px 0; font-size:15px; line-height:1.7;\"\u003e\r\n    Con más de \u003cspan style=\"font-weight:900;\"\u003e117 mil millones de reproducciones\u003c/span\u003e a lo largo de su carrera, más de \r\n    \u003cspan style=\"font-weight:900;\"\u003e310 certificaciones Platino de la RIAA\u003c/span\u003e en Estados Unidos y un \r\n    \u003cspan style=\"font-weight:900;\"\u003eGRAMMY® al Mejor Álbum de Música Urbana\u003c/span\u003e, KAROL G se consolida como una de las artistas femeninas más escuchadas e influyentes del mundo. \r\n    Su álbum \u003cspan style=\"font-weight:800;\"\u003eMAÑANA SERÁ BONITO\u003c/span\u003e también marcó un hito al convertirse en el primer álbum en español de una artista femenina en debutar en el No. 1 del Billboard 200.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- BLOQUE ARGENTINA --\u003e\r\n  \u003cp style=\"margin:0 0 20px 0; font-size:15px; line-height:1.7;\"\u003e\r\n    En Argentina, su llegada al Estadio River Plate representa un nuevo hito en una relación construida con una fanbase masiva, fiel y profundamente conectada con su música. \r\n    Cada visita de KAROL G al país generó una respuesta inmediata del público, con shows agotados, acampes, euforia y una emoción colectiva que confirma el lugar especial que ocupa en la escena local.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- DESTACADO FINAL --\u003e\r\n  \u003cp style=\"margin:30px 0; font-size:16px; line-height:1.7; font-weight:600;\"\u003e\r\n    Más que un show, \u003cspan style=\"font-weight:900; color:#fa4f34;\"\u003e“Viajando Por El Mundo Tropitour”\u003c/span\u003e será una celebración de la música latina en su máxima expresión: una noche de orgullo, identidad, emoción y comunidad en uno de los escenarios más importantes del país.\r\n  \u003c/p\u003e\r\n\r\n  \u003c!-- INFO VENTA --\u003e\r\n  \u003cdiv style=\"margin-top:30px;\"\u003e\r\n    \u003cp style=\"margin:0 0 10px 0; font-size:14px; font-weight:800; color:#fa4f34;\"\u003e\r\n      PREVENTA EXCLUSIVA MASTERCARD BANCO NACIÓN\r\n    \u003c/p\u003e\r\n    \u003cp style=\"margin:0 0 15px 0; font-size:14px; line-height:1.6;\"\u003e\r\n      Comenzará el miércoles 20 de mayo a las 12 hs, con hasta 6 cuotas sin interés con tarjeta de crédito Mastercard BNA.\r\n    \u003c/p\u003e\r\n\r\n    \u003cp style=\"margin:0 0 10px 0; font-size:14px; font-weight:800; color:#fa4f34;\"\u003e\r\n      VENTA GENERAL\r\n    \u003c/p\u003e\r\n    \u003cp style=\"margin:0; font-size:14px; line-height:1.6;\"\u003e\r\n      Disponible desde el jueves 21 de mayo a las 12 hs con todos los medios de pago. \r\n      Hasta 3 cuotas sin interés con tarjeta de crédito Mastercard Banco Nación.\r\n    \u003c/p\u003e\r\n  \u003c/div\u003e\r\n\r\n\u003c/div\u003e"},"version":1},{"id":"component-40d11ad0-1905-4e1d-8d30-6eef73802683","widgetType":"Html","state":{"enabled":true,"header":{"title":""},"config":{"customClass":"","containerAppearance":"centered","backgroundImageUrl":null,"backgroundColor":"","titleColor":"","paragraphColor":"","linkColor":""},"html":"\u003cdiv style=\"\r\n  margin-top:40px;\r\n  border:2px solid #fa4f34;\r\n  padding:20px;\r\n  box-sizing:border-box;\r\n\"\u003e\r\n\r\n  \u003cp style=\"\r\n    font-weight:900;\r\n    text-transform:uppercase;\r\n    margin:0 0 15px 0;\r\n    color:#fa4f34;\r\n  \"\u003e\r\n    THIS IS: KAROL G\r\n  \u003c/p\u003e\r\n\r\n  \u003cdiv style=\"\r\n    width:100%;\r\n    aspect-ratio: 16 / 9;\r\n    min-height: 352px;\r\n  \"\u003e\r\n    \u003ciframe \r\n      data-testid=\"embed-iframe\"\r\n      style=\"border-radius:12px; width:100%; height:100%; border:0;\"\r\n      src=\"https://open.spotify.com/embed/playlist/37i9dQZF1DZ06evO4e5iLu?utm_source=generator\u0026theme=0\u0026si=75ad75d6ec0e48c6\"\r\n      frameborder=\"0\"\r\n      allowfullscreen=\"\"\r\n
