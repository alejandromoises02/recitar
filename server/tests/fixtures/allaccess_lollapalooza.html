Color":"","linkColor":""},"url":"https://youtu.be/SyXWBdDgODY"},"version":1},{"id":"component-deac6425-3c16-4e9f-b317-295a4b7b957d","widgetType":"Faq","state":{"enabled":true,"header":{"title":"PREGUNTAS FRECUENTES"},"config":{"containerAppearance":"centered","customClass":"","backgroundImageUrl":null,"backgroundColor":"","titleColor":"","paragraphColor":"","linkColor":""},"faqItems":[{"title":"¿Qué incluyen las entradas de Lollapalooza 2027?","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003eGeneral\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"tight\" data-tight=\"true\"\u003e\u003cli style=\"text-align: left;\"\u003eAcceso al festival con más de 100 bandas y 5 escenarios\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eCompra de comida y bebida de los mejores chefs y restaurantes\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eCompra de merch oficial de bandas y del festival\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eAcceso al beergarden para mayores de 18 años\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eAcceso a los sectores Espíritu Verde, Rock \u0026amp; Recycle, Kidzapalooza, El Tunel y mucho más!\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eRecorrida de obras de arte de distintos artistas\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eEstaciones de agua gratuitas\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003ePuestos de carga de cashless\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eAlquiler de lockers\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eLos menores de 10 años entran gratis con un adulto con entrada\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003eGeneral Plus Rino\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"tight\" data-tight=\"true\"\u003e\u003cli style=\"text-align: left;\"\u003eIngreso a sector exclusivo dentro del predio donde habrá:\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eEspacios de relax con sombra\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eAcceso a wifi\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eBaños preferenciales\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003ePantallas gigantes con transmisión del festival\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eAcceso exclusivo a compra de gastronomía, merch, bebidas y carga de cashless\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eEstaciones de carga de celular\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eLockers gratuitos\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003ePuestos de hidratación exclusivos\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eJuegos en el césped\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eStaff dedicado a atender las necesidades de aquellos que tengan este abono.\u003cbr\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003eLolla Lounge\u003c/strong\u003e\u003c/p\u003e\u003cul class=\"tight\" data-tight=\"true\"\u003e\u003cli style=\"text-align: left;\"\u003eIngreso exclusivo a la zona de Lounge\u0026nbsp;\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eVista lateral a los escenarios\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eÁreas de relax y descanso con sombra\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eAcceso a wifi\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eBaños preferenciales\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eAcceso exclusivo a compra de gastronomía, merch, bebidas y carga de cashless\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eEstaciones de carga de celular\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eLockers gratuitos\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eLook Station\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003ePantallas gigantes con transmisión del festival\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003ePuestos de hidratación exclusivos\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eZona de juegos al aire libre\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eStaff dedicado a atender las necesidades de aquellos que tengan este abono\u003c/li\u003e\u003c/ul\u003e","warnings":[]}}},{"title":"Verificación de compra","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003eEste evento cuenta con verificación de compra. Para confirmar tus tickets necesitamos verificar la identidad del titular de la tarjeta.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eTendrás un plazo de 10 días desde realizada la compra para ingresar el \u003cstrong\u003ecódigo de 6 dígitos\u003c/strong\u003e que recibirás en el consumo de tu tarjeta. El mismo podrá tardar hasta 72hs hábiles en reflejarse en tu home banking. De no completar la verificación, tu compra podría ser dada de baja.\u003c/p\u003e","warnings":[]}}},{"title":"¿Qué es LollaCashless? ","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003eEs el sistema que permite al público asistente cargar su pulsera para consumir en Lolla Food y adquirir merchandising oficial durante los días de festival. \u0026nbsp; LollaCashless es el único medio de pago habilitado dentro del festival.\u003c/p\u003e","warnings":[]}}},{"title":"Kidzapalooza","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003ePensando en la seguridad de los niños que quieren asistir a Lollapalooza, Kidzapalooza cuenta con un sistema de acreditación propio. Las familias deberán registrarse obligatoriamente en los stands de ingreso al festival.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eUna vez que hayas retirado tus pulseras en los puntos de canje autorizados, habilitaremos un link donde deberás ingresar el código de la pulsera que compraste (ubicado en el frente de la pulsera donde se encuentra el chip) para registrarte como el adulto responsable de los menores que van a asistir al festival, a continuación deberás ingresar los nombres de los menores (cada adulto con entrada puede registrar hasta 4 menores).\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eUna vez finalizado el proceso de registro recibirás automáticamente un e-mail con la confirmación.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eLas pulseras de los menores que fueron registradas se retirarán obligatoriamente el día del festival en las boleterías de “Kidzapalooza” ubicadas en la Av. Márquez 700 o en los parkings del festival en caso de contar con este servicio.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eRecordá que vas a tener que presentar lo siguiente:\u003c/p\u003e\u003cul class=\"tight\" data-tight=\"true\"\u003e\u003cli style=\"text-align: left;\"\u003eAdulto responsable y su correspondiente DNI\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003ePulsera del adulto responsable registrado (debidamente colocada)\u003c/li\u003e\u003cli style=\"text-align: left;\"\u003eDNI de los menores registrados\u003c/li\u003e\u003c/ul\u003e","warnings":[]}}},{"title":"Canje de pulseras","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003eSolicité retiro en punto de venta, ¿Cuándo y donde puedo retirar mi/s pulsera/s?\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eA partir de diciembre anunciaremos las fechas y los puntos de canje habilitados.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003eSolicité envío a domicilio, ¿Cuándo me llegan la/s pulsera/s?\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eA partir de diciembre anunciaremos las fechas en que comenzarán a procesarse los envíos\u0026nbsp;de acuerdo al orden en que se hicieron las compras. Recibirás un mail con el código de seguimiento cuando se prepare tu envió.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eEl envío lo podrá recibir unicamente el titular de la tarjeta de crédito con la que se realizó la compra, presentando DNI y tarjeta de crédito.\u003c/p\u003e","warnings":[]}}},{"title":"Política de menores","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003eLos niños de hasta 10 años inclusive, o niños que cumplan los 11 años durante el festival (12, 13 y 14 de marzo de 2027), podrán ingresar al festival de forma gratuita acompañados de un adulto con entrada. Los niños de 11 años inclusive o más deberán adquirir la entrada.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eSe podrán acreditar hasta 4 menores por adulto. El registro de los menores de 10 años se podrá realizar con anticipación en la web de Lollapalooza.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eEl deber de supervisión permanece en todo momento bajo responsabilidad de los padres o la persona acompañante. Recomendamos que los menores de 14 años asistan acompañados por un adulto responsable.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003ePueden ingresar menores de edad a los sectores Plus y Lolla Lounge siempre y cuando hayan abonado una pulsera 2027 para esos sectores. Este espacio cuenta con capacidad limitada, próximamente publicaremos las instrucciones para adquirir el acceso y acreditar\u0026nbsp;al\u0026nbsp;menor.\u003c/p\u003e","warnings":[]}}},{"title":"Política de personas con movilidad reducida","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003ePolítica de personas con movilidad reducida titulares de CUD - Lollapalooza AR\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eLas personas con movilidad reducida titulares de CUD deberán abonar la entrada de menor valor a la venta y presentarse con el certificado el día del show.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003ePodrán acceder a las tarimas adaptadas en cada escenario, sujeto a capacidad limitada. Deberán ingresar por entrada de Av. Marquez al 600.\u003c/p\u003e\u003cp style=\"text-align: left;\"\u003eEn caso de necesitar asistir con un acompañante, porque así lo indica su certificado, el acompañante, también deberá abonar la entrada\u0026nbsp;de\u0026nbsp;menor\u0026nbsp;valor.\u003c/p\u003e","warnings":[]}}},{"title":"LEGALES SANTANDER","content":{"adf":null,"md":{"result":"\u003cp style=\"text-align: left;\"\u003e\u003cstrong\u003ePreventa\u0026nbsp;LollaFAM\u003c/strong\u003e\u003cbr\u003eC.F.T: COSTO FINANCIERO TOTAL C.F.T:\u0026nbsp; O% CARTERA DE CONSUMO Tasa fija nominal y efectiva anual 0%. Vigencia del 03/06/26 hasta el 14/03/27. Promoción valida sólo para la comunidad LollaFam, para más información visitar \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://nam10.safelinks.protection.outlook.com/?url=http%3A%2F%2Fwww.lollapaloozaar.com%2Flollafam\u0026amp;data=05%7C02%7Ccandelaria%40allaccess.com.ar%7Cf317e098c4304e838be508debf633391%7Cfec89bb3f1ea42d1bf17c6252641ee0e%7C0%7C0%7C639158629952628613%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C\u0026amp;sdata=%2FCTZKDmA0H24KI1TXRaT7VlwncClygMDfr6FgbMV8SU%3D\u0026amp;reserved=0\"\u003ewww.lollapaloozaar.com/lollafam\u003c/a\u003e. Preventa LollaFam 03/06/26 a las 10hs. Por 24hs o hasta agotar stock, lo que suceda primero. Stock preventa LollaFam: ocho mil cuatrocientos noventa y ocho\u0026nbsp;(8498)\u0026nbsp;abonos (entendiéndose por tal a la compra del paquete para asistir a las tres (3) fechas programadas del EVENTO), es decir veinticinco mil cuatrocientos noventa y cuatro (25494)\u0026nbsp;tickets, lo que ocurra primero. Cupo máximo de 2 entradas por cliente. Ejemplo: Una compra de $120.000 realizada con su Tarjeta Santander VISA, podrá ser financiada en 6 cuotas de $20.000 cada una. Promoción válida sobre el valor de entradas. No incluye service charge. Los accionistas del Banco Santander Argentina S.A. no responden en exceso de su integración accionari
